<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Aviso de nova versão</title>
<style>
:root{--bg:#282a36;--card:#343746;--fg:#f8f8f2;--muted:#9aa0b8;--info:#8be9fd;--green:#0a614e;--green-h:#106e5b;--purple:#bd93f9}
body{background:var(--bg);color:var(--fg);font:14px system-ui;margin:24px;display:flex;gap:32px;flex-wrap:wrap}
h2{font-size:14px;color:var(--muted);margin:0 0 8px}
.panel{width:340px;background:var(--card);border-radius:8px;padding:8px}
.cell{display:flex;gap:12px;padding:10px;border-radius:6px;background:#3c3f52;margin:4px 0}
.bar{width:4px;border-radius:2px;background:var(--info)}
.t{font-weight:700}.m{color:var(--muted);margin:3px 0}.time{color:var(--muted);font-size:12px}
.btn{display:inline-block;margin-top:6px;padding:4px 14px;border:2px solid var(--green);border-radius:20px;background:transparent;color:var(--fg)}
.btn:hover{background:var(--green-h)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--purple);margin-top:4px}
.set{width:340px;background:var(--card);border-radius:8px;padding:12px}
.row{display:flex;justify-content:space-between;align-items:center}
.sw{width:36px;height:18px;border-radius:9px;background:var(--green);position:relative}
.sw::after{content:"";position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff}
</style></head><body>
<div><h2>Central de notificações</h2><div class="panel"><div class="cell"><div class="bar"></div><div style="flex:1"><div class="t">Nova versão disponível</div><div class="m">A versão 2.22.0 da MOINEX foi lançada. Você está na 2.21.0.</div><span class="btn">Abrir página</span><div class="time">agora</div></div><div class="dot"></div></div></div></div>
<div><h2>Configurações</h2><div class="set"><div class="row"><span>Verificar atualizações automaticamente</span><span class="sw"></span></div></div></div>
</body></html>
