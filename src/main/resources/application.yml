spring:
  datasource:
    url: jdbc:sqlite:${moinex.db.path}?journal_mode=WAL
    username:
    password:
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-timeout: 1000

  flyway:
    enabled: true
    depends-on: entityManagerFactory
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        generate_statistics: false
    defer-datasource-initialization: false

  sql:
    init:
      mode: never

logging:
  level:
    root: INFO
    org.moinex: INFO
    org.hibernate.SQL: OFF
    com.zaxxer.hikari: OFF

moinex:
  ai:
    attachment-instruction-template: >
      The user attached the following file(s): {0}. Extract every transaction and investment
      operation you can find across all of them. Call propose_changes with one entry per
      regular wallet/credit-card transaction (create_wallet_transaction, create_credit_card_debt,
      pay_credit_card_invoice) and one entry per stock/FII/crypto purchase or sale, dividend, or CDB
      application/redemption (record_stock_purchase, record_stock_sale, record_dividend,
      apply_to_bond, redeem_bond) - a market operation is never a create_wallet_transaction. Match categories, wallets, credit cards, tickers and bonds
      against the existing ones listed in context when they fit; otherwise propose a new category
      name (tickers/bonds cannot be invented - leave unmatched if none fits). Amounts must always
      be positive, even for statement lines shown with a minus sign - use movementType ("income" or
      "expense") to convey direction for wallet entries instead of a signed amount. The app checks
      every line against what is already recorded, so do not look for duplicates yourself: lines
      already recorded come back in the ignored list and pending ones are confirmed instead of
      duplicated. For any line that looks like paying a credit card bill in full, use
      get_credit_card_invoice_payment_status first and
      only propose it (as kind credit_card_payment, never as a wallet expense) if that invoice is
      not already fully paid. For a credit card purchase, always read installments and
      installmentNumber off the statement's own marker (e.g. "3/10" means installmentNumber 3,
      installments 10; no marker or "1/N" means installmentNumber 1) - amount is always the value
      of that specific line/installment, never a computed total. A line with installmentNumber
      greater than 1 is a purchase made before this statement that's simply still being paid off -
      the app already posted every installment of it, one per monthly invoice, when the purchase
      was first recorded. Send such a line with date as the original purchase date printed next to
      it, not today, and the app skips it on its own when the purchase is already recorded on that
      card; it comes back in the ignored list and you should mention it in your reply.


      --- Files ---

      {1}
