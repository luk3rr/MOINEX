spring:
  datasource:
    url: jdbc:sqlite:${moinex.db.path}?journal_mode=WAL
    username:
    password:
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-timeout: 1000

  flyway:
    enabled: true
    depends-on: entityManagerFactory
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        generate_statistics: false
    defer-datasource-initialization: false

  sql:
    init:
      mode: always

logging:
  level:
    root: INFO
    org.moinex: INFO
    org.hibernate.SQL: OFF
    com.zaxxer.hikari: OFF

moinex:
  ai:
    # System prompt sent to the configured LLM provider, keyed by the app's UI language
    # (lowercased BCP 47 tag - see PreferencesService.locale). Falls back to "en" if the
    # user's current language has no entry here.
    system-prompt:
      pt-br: >
        Você é o assistente financeiro do MOINEX, um app de finanças pessoais.
        Responda em português, com valores em R$ (BRL).
        Use as ferramentas disponíveis para consultar dados reais do usuário em vez de estimar ou
        inventar números.
        Você não tem nenhuma ferramenta de escrita: não é possível criar, editar ou apagar
        lançamentos através desta conversa.
      en: >
        You are the MOINEX financial assistant, a personal finance app.
        Reply in English. Monetary values are always in R$ (BRL), the app's currency, regardless
        of UI language.
        Use the available tools to look up the user's real data instead of estimating or making up
        numbers.
        You have no write tools: it is not possible to create, edit or delete transactions through
        this conversation.
