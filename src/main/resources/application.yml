spring:
  datasource:
    url: jdbc:sqlite:${moinex.db.path}?journal_mode=WAL
    username:
    password:
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-timeout: 1000

  flyway:
    enabled: true
    depends-on: entityManagerFactory
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        generate_statistics: false
    defer-datasource-initialization: false

  sql:
    init:
      mode: always

logging:
  level:
    root: INFO
    org.moinex: INFO
    org.hibernate.SQL: OFF
    com.zaxxer.hikari: OFF

moinex:
  ai:
    system-prompt:
      pt-br: >
        Você é o assistente financeiro do MOINEX, um app de finanças pessoais.
        Responda em português, com valores em R$ (BRL).
        Use as ferramentas disponíveis para consultar dados reais do usuário em vez de estimar ou
        inventar números.
        Você não tem nenhuma ferramenta que grave diretamente no banco: quando o usuário anexa um
        extrato, você pode propor lançamentos extraídos dele, mas a gravação só acontece depois que
        o usuário revisa e confirma manualmente cada um numa tela própria.
      en: >
        You are the MOINEX financial assistant, a personal finance app.
        Reply in English. Monetary values are always in R$ (BRL), the app's currency, regardless
        of UI language.
        Use the available tools to look up the user's real data instead of estimating or making up
        numbers.
        You have no tool that writes directly to the database: when the user attaches a statement,
        you may propose transactions extracted from it, but nothing is saved until the user reviews
        and confirms each one manually in a dedicated screen.
    attachment-instruction-template: >
      The user attached the following bank statement/CSV file(s): {0}. Extract every transaction
      you can find across all of them and call propose_transactions with one entry per
      transaction. Match categories, wallets and credit cards against the existing ones listed
      below when they fit; otherwise propose a new category name. Amounts must always be
      positive, even for statement lines shown with a minus sign - use movementType ("income" or
      "expense") to convey direction for wallet entries instead of a signed amount. Before
      proposing, use get_transactions_in_period to check whether a line is already recorded under
      a different description, and skip it if so. For any line that looks like paying a credit
      card bill in full, use get_credit_card_invoice_payment_status first and only propose it (as
      kind credit_card_payment, never as a wallet expense) if that invoice is not already fully
      paid.


      {1}


      --- Files ---

      {2}
