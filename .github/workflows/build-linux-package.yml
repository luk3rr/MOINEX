name: Build Linux Package

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-package:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install packaging and smoke test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot xvfb libgtk-3-0 libxtst6 libxxf86vm1 xdg-utils

      - name: Cache the standalone Python archive
        uses: actions/cache@v4
        with:
          path: build/python-linux-download
          key: python-linux-${{ hashFiles('scripts/linux/setup-python.sh', 'requirements.txt') }}

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            VERSION="${VERSION#v}"
            if [ -z "$VERSION" ]; then
              VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts | head -1)"
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"

      - name: Build packages
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./scripts/linux/build-package.sh all --version "$VERSION"

      - name: Validate packages
        run: ./scripts/linux/validate-package.sh

      - name: Upload packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: moinex-linux-packages
          path: |
            installer-output/*.deb
            installer-output/*.tar.gz
          retention-days: 90

      - name: Upload packages to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-output/*.deb
            installer-output/*.tar.gz
